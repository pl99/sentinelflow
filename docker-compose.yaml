services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: sentinelflow-kafka
    hostname: kafka
    networks:
      - sentinelflow-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init-topics:
    image: confluentinc/cp-kafka:latest
    container_name: sentinelflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - sentinelflow-net
    entrypoint: ["/bin/sh", "-c"]
    command: |
      kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists --topic raw-events --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists --topic enriched-events --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists --topic anomaly-events --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists --topic llm-insights --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9094 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1 &&
      echo "All topics created"

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sentinelflow-postgres
    networks:
      - sentinelflow-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-jobmanager:
    image: flink:1.18-java17
    container_name: sentinelflow-flink-jobmanager
    networks:
      - sentinelflow-net
    ports:
      - "8081:8081"
    command: jobmanager
    mem_limit: 2g
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 15s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    image: flink:1.18-java17
    container_name: sentinelflow-flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks:
      - sentinelflow-net
    command: taskmanager
    mem_limit: 2g
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints

  ollama:
    image: ollama/ollama:latest
    container_name: sentinelflow-ollama
    networks:
      - sentinelflow-net
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  pg_data:
  ollama_data:

networks:
  sentinelflow-net:
    name: sentinelflow-net
    driver: bridge
