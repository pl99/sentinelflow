server:
  port: 8084

spring:
  application:
    name: sentinelflow-llm-analyzer

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: llm-analyzer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sentinelflow.common
        spring.json.value.default.type: com.sentinelflow.common.event.AnomalyEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.sentinelflow.llm: DEBUG

sentinelflow:
  llm:
    language: ${LLM_LANGUAGE:ru}
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:1.7b}
      timeout: 300s
