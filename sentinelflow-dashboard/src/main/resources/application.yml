server:
  port: 8085

spring:
  application:
    name: sentinelflow-dashboard

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: dashboard
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sentinelflow.common
        spring.json.value.default.type: com.sentinelflow.common.event.LlmInsight

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:streaming}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

sentinelflow:
  kafka:
    broadcast:
      group-id: ${spring.application.name}-broadcast-${random.uuid}

  storage:
    query-url: ${STORAGE_QUERY_URL:http://localhost:8086}
